<style>
:root{
  --bg:#F4F7FC;
  --card:#FFFFFF;
  --primary:#024dc2;
  --primary-dark:#013a94;
  --primary-light:#EAF2FF;
  --gold:#E2C27A;
  --gold-dark:#C9A25C;
  --text:#121936;
  --muted:#5b6b85;
  --border:#E3E9F2;
  --danger:#e0577a;
  --fd:'Lora', Georgia, serif;
  --fb:'Roboto', Arial, sans-serif;
  --radius:20px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--fb);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
img{display:block;max-width:100%;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}

.quiz-app{
  position:relative;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:64px 16px 40px;
}

/* progress bar */
.progress-wrap{
  position:fixed;
  top:0;left:0;right:0;
  height:56px;
  background:rgba(244,247,252,0.92);
  backdrop-filter:blur(6px);
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 20px;
  z-index:50;
  border-bottom:1px solid var(--border);
}
.progress-track{
  flex:1;
  height:8px;
  background:var(--border);
  border-radius:99px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--primary),#3a7bff);
  border-radius:99px;
  transition:width .5s cubic-bezier(.4,0,.2,1);
}
.progress-gift{
  font-size:22px;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1), filter .4s;
  filter:grayscale(60%) opacity(.6);
}
.progress-gift.reached{
  transform:scale(1.35) rotate(-8deg);
  filter:none;
  animation:giftPulse 1.1s ease-in-out infinite;
}
@keyframes giftPulse{
  0%,100%{transform:scale(1.3) rotate(-8deg);}
  50%{transform:scale(1.45) rotate(6deg);}
}

.back-btn{
  position:fixed;
  top:64px; left:16px;
  width:38px;height:38px;
  border-radius:50%;
  background:var(--card);
  border:1px solid var(--border);
  color:var(--muted);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
  z-index:40;
  box-shadow:0 2px 8px rgba(18,25,54,0.06);
}
.back-btn:hover{color:var(--primary);border-color:var(--primary-light);}

.screen-stage{
  width:100%;
  max-width:560px;
  margin-top:12px;
}

.screen{
  background:var(--card);
  border-radius:var(--radius);
  padding:36px 28px 28px;
  box-shadow:0 12px 32px rgba(18,25,54,0.08);
  animation:screenIn .45s cubic-bezier(.22,1,.36,1);
  overflow:hidden;
}
@keyframes screenIn{
  from{opacity:0; transform:translateY(18px) scale(.98);}
  to{opacity:1; transform:translateY(0) scale(1);}
}

.step-label{
  font-size:12px;
  font-weight:700;
  letter-spacing:.06em;
  color:var(--primary);
  background:var(--primary-light);
  display:inline-block;
  padding:4px 12px;
  border-radius:99px;
  margin-bottom:16px;
}

.screen h1,.screen h2{
  font-family:var(--fd);
  font-weight:700;
  color:var(--text);
  line-height:1.32;
}
.screen h1{font-size:clamp(21px,5vw,26px); margin-bottom:10px;}
.screen h2{font-size:clamp(19px,4.5vw,23px); margin-bottom:8px;}
.subtitle{font-size:14.5px; color:var(--muted); margin-bottom:22px; line-height:1.55;}

/* welcome screen */
.badge-icon{
  width:64px;height:64px;
  border-radius:50%;
  background:var(--primary-light);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;
  margin-bottom:18px;
  flex-shrink:0;
}
.welcome-kicker{display:flex; align-items:center; gap:14px; margin-bottom:24px;}
.welcome-kicker .badge-icon{margin-bottom:0;}
.welcome-kicker-text{text-align:left;}
.welcome-kicker-text .wk-line1{font-family:var(--fd); font-weight:700; font-size:15px; color:var(--text); line-height:1.35;}
.welcome-kicker-text .wk-line2{font-size:13px; color:var(--muted); margin-top:2px;}
.welcome h1{font-size:clamp(19px,4.5vw,23px); margin-bottom:26px;}
.btn-primary{
  width:100%;
  background:var(--primary);
  color:#fff;
  font-family:var(--fd);
  font-weight:700;
  font-size:16.5px;
  padding:16px 20px;
  border-radius:14px;
  transition:transform .15s, background .2s, box-shadow .2s;
  box-shadow:0 8px 20px rgba(2,77,194,0.28);
}
.btn-primary:hover{background:var(--primary-dark); transform:translateY(-2px);}
.btn-primary:active{transform:translateY(0);}
.btn-primary:disabled{background:#c7d3e6; box-shadow:none; cursor:not-allowed; transform:none;}
.trust-list{margin-top:46px; display:flex; flex-direction:column; gap:12px; align-items:center;}
.trust-list li{
  list-style:none;
  font-size:13.5px;
  color:var(--muted);
  display:flex; align-items:center; gap:10px;
  justify-content:center;
}
.trust-list li .ic{font-size:16px;}

/* option rows (single & multi) */
.options{display:flex; flex-direction:column; gap:10px;}
.options.grid{flex-direction:row; flex-wrap:wrap;}
.opt,.welcome-opt{
  border:1.5px solid var(--border);
  border-radius:14px;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  font-size:15px;
  line-height:1.45;
  transition:background .18s ease, border-color .18s ease, box-shadow .18s ease;
  background:#fff;
  cursor:pointer;
}
.options:not(.grid) .opt{width:100%;}
.options.grid .opt{
  flex:1 1 calc(50% - 10px);
  justify-content:center;
  text-align:center;
  flex-direction:column;
  gap:6px;
  padding:18px 12px;
}
.opt:hover,.welcome-opt:hover{border-color:var(--primary); background:var(--primary-light);}
.opt .opt-icon{font-size:20px; flex-shrink:0;}
.opt .opt-text{flex:1;}
.opt.selected{
  border-color:var(--primary);
  background:var(--primary-light);
  box-shadow:0 0 0 3px rgba(2,77,194,.10);
}
.opt.goal{border-color:var(--gold-dark);}
.opt.goal.selected{background:#FBF3E3; border-color:var(--gold-dark); box-shadow:0 0 0 3px rgba(226,194,122,.28);}
.opt .check{
  margin-left:auto;
  width:20px;height:20px;
  border-radius:50%;
  border:1.5px solid #cfd8e8;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;
  color:#fff;
  transition:all .18s ease;
}
.opt.selected .check{background:var(--primary); border-color:var(--primary);}
.opt.selected.goal .check{background:var(--gold-dark); border-color:var(--gold-dark);}
.opt[data-multi] .check{border-radius:6px;}

.multi-footer{
  margin-top:22px;
  display:flex; flex-direction:column; gap:8px;
}

/* info screens */
.info-title.lg{font-size:clamp(24px,6vw,30px);}
.info-eyebrow{font-size:14.5px; font-weight:700; color:var(--muted); text-align:center; line-height:1.45; margin-bottom:4px;}
.big-word{font-family:var(--fd); font-weight:800; color:var(--primary); text-align:center; line-height:1.16; margin:2px 0 20px;}
.big-word.short{font-size:clamp(32px,10.5vw,46px);}
.big-word.sentence{font-size:clamp(23px,6.5vw,29px);}
.info-body{font-size:15px; line-height:1.7; color:var(--text); margin-bottom:8px;}
.info-body.lg{font-size:17px; line-height:1.8;}
.info-body strong{color:var(--primary);}
.emph-inline{color:var(--primary); font-weight:800;}
.info-bullets{margin:16px 0 4px; list-style:none; display:flex; flex-direction:column; gap:11px;}
.info-bullets li{display:flex; gap:10px; align-items:flex-start; font-size:15.5px; line-height:1.6; color:var(--text);}
.info-bullets li::before{content:'✓'; color:var(--primary); font-weight:800; flex-shrink:0; margin-top:1px;}
.quote-box{
  background:var(--primary-light);
  border-left:4px solid var(--primary);
  border-radius:10px;
  padding:16px 18px;
  font-family:var(--fd);
  font-style:italic;
  font-size:15.5px;
  color:var(--text);
  margin:18px 0;
}
.info-image{border-radius:16px; overflow:hidden; margin-bottom:18px;}
.info-image img{width:100%; object-fit:cover; max-height:220px;}
.square-illustration{width:100%; max-width:200px; margin:0 auto 20px; aspect-ratio:1/1; border-radius:22px; overflow:hidden; box-shadow:0 6px 18px rgba(18,25,54,0.08);}
.square-illustration svg{width:100%; height:100%; display:block;}

/* timeline (screen 16) */
.timeline-head{text-align:center;}
.tl-eyebrow{
  font-size:11.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
  color:var(--gold-dark); margin-bottom:8px;
}
.timeline-head .subtitle{text-align:center;}
.timeline{display:flex; flex-direction:column; gap:0; margin:24px 0;}
.tl-step{display:flex; align-items:flex-start; gap:16px;}
.tl-dot{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:22px; flex-shrink:0;
  box-shadow:0 4px 10px rgba(18,25,54,0.12);
}
.tl-step:nth-child(1) .tl-dot{background:linear-gradient(135deg,#fff,var(--primary-light)); border:2px solid var(--primary);}
.tl-step:nth-child(2) .tl-dot{background:linear-gradient(135deg,var(--primary),var(--primary-dark));}
.tl-step:nth-child(3) .tl-dot{background:linear-gradient(135deg,var(--gold),var(--gold-dark));}
.tl-line{width:3px; flex:none; background:linear-gradient(var(--primary),var(--gold-dark)); margin:4px 0 4px 24px; min-height:30px;}
.tl-content{padding-bottom:22px; padding-top:4px;}
.tl-content b{font-family:var(--fd); font-size:18px; font-weight:700; display:block; margin-bottom:3px;}
.tl-content span{font-size:14px; color:var(--muted);}
.tl-step:last-child .tl-content{padding-bottom:0;}
.formula-highlight{
  background:linear-gradient(135deg,#FFF8EA,#FBF3E3);
  border:1.5px solid var(--gold-dark);
  border-radius:14px;
  padding:18px 20px;
  margin:22px 0 8px;
  text-align:center;
  font-family:var(--fd);
  font-weight:700;
  font-size:17px;
  color:var(--text);
  line-height:1.5;
}

/* forms */
.field-label{font-size:13.5px; font-weight:700; color:var(--text); margin-bottom:8px; display:block;}
.field-input{
  width:100%;
  border:1.5px solid var(--border);
  border-radius:12px;
  padding:15px 16px;
  font-size:16px;
  font-family:var(--fb);
  margin-bottom:8px;
  transition:border-color .2s;
  background:#fbfcfe;
}
.field-input:focus{outline:none; border-color:var(--primary); background:#fff;}
.field-hint{font-size:12.5px; color:var(--muted); margin-bottom:20px;}
.field-hint.error{color:var(--danger);}

/* loading screen */
.loading-wrap{display:flex; flex-direction:column; align-items:center; text-align:center; padding:12px 0 4px;}
.ring-wrap{position:relative; width:150px; height:150px; margin-bottom:22px;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-pct{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--fd); font-size:28px; font-weight:700; color:var(--primary);
}
.loading-status{font-size:14.5px; color:var(--muted); min-height:22px; margin-bottom:22px;}
.testi-viewport{width:100%; overflow:hidden; border-radius:14px;}
.testi-track{display:flex; transition:transform .6s cubic-bezier(.22,1,.36,1);}
.testi-card{
  flex:0 0 100%;
  box-sizing:border-box;
  background:var(--primary-light);
  border-radius:14px;
  padding:16px 18px;
  text-align:left;
}
.testi-card p{font-size:14px; font-style:italic; line-height:1.6; color:var(--text); margin-bottom:10px;}
.testi-card .who{display:flex; align-items:center; gap:10px;}
.testi-card .avatar{
  width:34px;height:34px;border-radius:50%;
  background:var(--gold); color:#fff; font-weight:700; font-size:13px;
  display:flex;align-items:center;justify-content:center; font-family:var(--fd);
  flex-shrink:0;
}
.testi-card .who-name{font-size:13px; font-weight:700;}
.testi-card .who-role{font-size:12px; color:var(--muted);}

/* result screen */
.result-hero{
  background:linear-gradient(135deg,var(--primary),#3a7bff);
  margin:-36px -28px 26px;
  padding:38px 28px 32px;
  border-radius:20px 20px 0 0;
  text-align:center;
}
.result-hero .emoji{font-size:42px; margin-bottom:10px;}
.result-hero h1{font-family:var(--fd); font-weight:700; color:#fff; font-size:clamp(21px,5.5vw,25px); line-height:1.32;}
.result-hero p{font-size:14.5px; color:rgba(255,255,255,.85); margin-top:8px;}
.priority-spotlight{
  background:linear-gradient(135deg,#FFF8EA,#FDEFD2);
  border:1.5px solid var(--gold-dark);
  border-radius:16px;
  padding:24px 20px;
  text-align:center;
  margin-top:26px;
  box-shadow:0 8px 22px rgba(201,162,92,0.20);
}
.spotlight-icon{font-size:34px; margin-bottom:6px;}
.spotlight-tag{font-size:11.5px; font-weight:800; letter-spacing:.09em; color:var(--gold-dark); margin-bottom:6px;}
.priority-spotlight h2{font-family:var(--fd); font-size:clamp(21px,5.5vw,25px); color:var(--text); margin-bottom:8px;}
.priority-spotlight p{font-size:14.5px; color:var(--muted); line-height:1.6;}
.result-section{margin-top:26px;}
.result-section h3{
  font-family:var(--fd); font-size:16.5px; font-weight:700; color:var(--text);
  margin-bottom:12px; display:flex; align-items:center; gap:8px;
}
.desire-list{display:flex; flex-direction:column; gap:10px;}
.desire-item{
  display:flex; align-items:flex-start; gap:10px;
  background:#FBF3E3; border:1px solid #F0DFB8; border-radius:12px; padding:12px 14px;
  font-size:14.5px; line-height:1.5;
}
.desire-item .num{
  font-family:var(--fd); font-weight:700; color:var(--gold-dark); font-size:16px; flex-shrink:0;
}
.feel-chips{display:flex; flex-wrap:wrap; gap:8px;}
.feel-chip{
  background:var(--primary-light); color:var(--primary); font-size:13px; font-weight:600;
  padding:8px 14px; border-radius:99px;
}
.score-row{margin-bottom:16px;}
.score-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
.score-name{font-size:14.5px; font-weight:700;}
.score-count{font-size:13px; color:var(--muted);}
.score-bar-track{height:10px; background:var(--border); border-radius:99px; overflow:hidden;}
.score-bar-fill{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--primary),#3a7bff); width:0%; transition:width 1s cubic-bezier(.22,1,.36,1);}
.score-bar-fill.priority{background:linear-gradient(90deg,var(--gold-dark),var(--gold));}
.priority-note{
  font-size:13.5px; color:var(--text); background:var(--bg); border-radius:12px;
  padding:14px 16px; margin-top:6px; line-height:1.6;
}
.priority-note b{color:var(--primary-dark);}
.cta-wrap{margin-top:30px;}
.result-cta{display:block; text-align:center; text-decoration:none;}
.result-cta.pulse{animation:ctaPulse 2.2s ease-in-out infinite;}
@keyframes ctaPulse{
  0%,100%{box-shadow:0 8px 20px rgba(2,77,194,0.28);}
  50%{box-shadow:0 10px 28px rgba(2,77,194,0.48);}
}
.cta-sub{text-align:center; font-size:13px; color:var(--muted); margin-top:12px;}

/* confetti */
.confetti{position:fixed; top:-20px; font-size:20px; pointer-events:none; z-index:60; animation:fall linear forwards;}
@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg); opacity:0;}
}

@media (max-width:420px){
  .screen{padding:28px 20px 22px;}
  .options.grid .opt{flex:1 1 100%;}
  .result-hero{margin:-28px -20px 26px; padding:32px 20px 26px;}
}
</style>
</head>

<div class="quiz-app">
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-gift" id="progressGift">🎁</div>
  </div>
  <button class="back-btn" id="backBtn" aria-label="Quay lại">←</button>
  <main class="screen-stage" id="screenStage"></main>
</div>

<script>

  inner: `<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
    <rect width="320" height="320" rx="28" fill="var(--primary-light)"/>

    <circle cx="160" cy="140" r="24" fill="var(--text)"/>
  </svg>`,

const SHEET_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbzTx46AXjelV-LDJNkh9i0zWt90w_ekqTmS1ZNU8aJos_Xuo1lm-vrC_-z4FwfBFCArVA/exec';

const state = { index:0, answers:{}, email:'', name:'', sheetSent:false, utmLink:window.location.href };

const stage = document.getElementById('screenStage');
const progressFill = document.getElementById('progressFill');
const progressGift = document.getElementById('progressGift');
const backBtn = document.getElementById('backBtn');

backBtn.addEventListener('click', goBack);

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function gaEvent(name, params){
  try{ if(typeof gtag === 'function') gtag('event', name, params || {}); }catch(e){}
}
function fbEvent(name, params){
  try{ if(typeof fbq === 'function') fbq('track', name, params || {}); }catch(e){}
}
function trackScreen(s){
  gaEvent('quiz_step_view', {
    quiz_name: 'teamlead_quiz',
    step_number: s.id,
    step_label: 'Trang #' + s.id,
    step_type: s.type
  });
}

function firstWords(text, n){
  return text.split(/\s+/).slice(0,n).join(' ');
}
function answerSummary(id){
  const screen = SCREENS.find(sc=>sc.id===id);
  const val = state.answers[id];
  if(!screen || val===undefined || val===null) return '';
  if(screen.type==='single'){
    return screen.options[val] ? firstWords(screen.options[val].t, 4) : '';
  }
  if(Array.isArray(val)){
    return val.map(i=> screen.options[i] ? firstWords(screen.options[i].t, 4) : '').join(' | ');
  }
  return '';
}

function sendToSheet(payload){
  if(!SHEET_WEBHOOK_URL) return;
  try{
    fetch(SHEET_WEBHOOK_URL, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
  }catch(e){}
}

function updateProgress(){
  const s = SCREENS[state.index];
  let pct;
  if(s.type==='loading' || s.type==='result'){ pct = 100; }
  else {
    let count = 0;
    for(const sc of SCREENS){
      if(sc.id > s.id) break;
      if(QUESTION_IDS.includes(sc.id)) count++;
    }
    pct = Math.round((count/QUESTION_IDS.length)*100);
  }
  progressFill.style.width = pct + '%';
  progressGift.classList.toggle('reached', pct >= 100);
}

function goTo(index){
  state.index = index;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function goNext(){ if(state.index < SCREENS.length-1) goTo(state.index+1); }
function goBack(){ if(state.index > 0) goTo(state.index-1); }

function render(){
  const s = SCREENS[state.index];
  const hideBack = (s.id===1 || s.type==='loading' || s.type==='result');
  backBtn.style.display = hideBack ? 'none' : 'flex';

  let html = '';
  if(s.type==='welcome') html = renderWelcome(s);
  else if(s.type==='info') html = renderInfo(s);
  else if(s.type==='timeline') html = renderTimeline(s);
  else if(s.type==='single') html = renderChoice(s,false);
  else if(s.type==='multi') html = renderChoice(s,true);
  else if(s.type==='email') html = renderEmail(s);
  else if(s.type==='name') html = renderName(s);
  else if(s.type==='loading') html = renderLoading(s);
  else if(s.type==='result') html = renderResult(s);

  stage.innerHTML = `<div class="screen">${html}</div>`;
  updateProgress();
  attachEvents(s);
  trackScreen(s);

  if(s.type==='loading') startLoading();
  if(s.type==='result') launchConfetti();
}

function stepLabel(s){
  if(s.type!=='single' && s.type!=='multi') return '';
  const pos = QUESTION_IDS.indexOf(s.id)+1;
  return `<div class="step-label">Câu ${pos}/${QUESTION_IDS.length}</div>`;
}

function renderWelcome(s){
  return `
    <div class="welcome">
      <div class="welcome-kicker">
        <div class="badge-icon">🚀</div>
        <div class="welcome-kicker-text">
          <div class="wk-line1">Trở thành Team Lead truyền cảm hứng</div>
          <div class="wk-line2">Đội ngũ đồng lòng · Cấp trên tin tưởng</div>
        </div>
      </div>
      <h1>${esc(s.title)}</h1>
      <div class="opt welcome-opt" data-idx="0">
        <span class="opt-icon">✅</span>
        <span class="opt-text">${esc(s.cta)}</span>
        <span class="check"></span>
      </div>
      <ul class="trust-list">
        ${s.trust.map(t=>`<li><span class="ic">${t.icon}</span>${esc(t.text)}</li>`).join('')}
      </ul>
    </div>`;
}

function renderInfo(s){
  const titleCls = 'info-title' + (s.big ? ' lg' : '');
  const bodyCls = 'info-body' + (s.big ? ' lg' : '');
  const visual = s.squareArt
    ? `<div class="square-illustration">${s.squareArt}</div>`
    : (s.image ? `<div class="info-image"><img src="${s.image}" alt=""></div>` : (s.icon ? `<div class="badge-icon">${s.icon}</div>` : ''));
  const showEyebrow = s.bigWord && s.bigWord !== s.title;
  const titleBlock = s.bigWord
    ? `${showEyebrow ? `<div class="info-eyebrow">${esc(s.title)}</div>` : ''}<div class="big-word ${s.bigWordSize||'short'}">${esc(s.bigWord)}</div>`
    : `<h2 class="${titleCls}">${esc(s.title)}</h2>`;
  return `
    ${stepLabel(s)}
    ${visual}
    ${titleBlock}
    <p class="${bodyCls}">${s.body}</p>
    ${s.bullets ? `<ul class="info-bullets">${s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>` : ''}
    ${s.bodyAfter ? `<p class="${bodyCls}" style="margin-top:14px;">${esc(s.bodyAfter)}</p>` : ''}
    <button class="btn-primary" data-action="continue" style="margin-top:22px;">${s.cta}</button>
  `;
}

function renderTimeline(s){
  return `
    <div class="timeline-head">
      <div class="tl-eyebrow">${esc(s.eyebrow)}</div>
      <h2 class="info-title lg">${esc(s.title)}</h2>
      <p class="subtitle">${esc(s.subtitle)}</p>
    </div>
    <div class="timeline">
      ${s.timeline.map((t,i)=>`
        <div class="tl-step">
          <div>
            <div class="tl-dot">${t.icon}</div>
            ${i < s.timeline.length-1 ? '<div class="tl-line"></div>' : ''}
          </div>
          <div class="tl-content"><b>${esc(t.t)}</b><span>${esc(t.d)}</span></div>
        </div>
      `).join('')}
    </div>
    <div class="formula-highlight">${esc(s.footer)}</div>
    <button class="btn-primary" data-action="continue">${s.cta}</button>
  `;
}

function renderChoice(s, isMulti){
  const layoutClass = s.layout==='grid' || s.layout==='cards' ? 'grid' : '';
  const saved = state.answers[s.id];
  const optsHtml = s.options.map((o,i)=>{
    const selected = isMulti ? (Array.isArray(saved) && saved.includes(i)) : (saved===i);
    return `
      <div class="opt ${selected?'selected':''} ${o.goal?'goal':''}" data-idx="${i}" ${isMulti?'data-multi':''}>
        <span class="opt-icon">${o.i}</span>
        <span class="opt-text">${esc(o.t)}</span>
        <span class="check">${selected?'✓':''}</span>
      </div>`;
  }).join('');

  const count = isMulti ? (Array.isArray(saved) ? saved.length : 0) : 0;
  const titleHtml = s.titleHtml ? s.titleHtml : esc(s.title);

  return `
    ${stepLabel(s)}
    <h2>${titleHtml}</h2>
    ${s.subtitle ? `<p class="subtitle">${esc(s.subtitle)}</p>` : '<div style="margin-bottom:22px;"></div>'}
    <div class="options ${layoutClass}">${optsHtml}</div>
    ${isMulti ? `
      <div class="multi-footer">
        <button class="btn-primary" id="continueBtn" data-action="continue-multi" ${count>0?'':'disabled'}>Tiếp tục →</button>
      </div>` : ''}
  `;
}

function renderEmail(s){
  return `
    <h2>${esc(s.title)}</h2>
    <p class="subtitle">${esc(s.subtitle)}</p>
    <label class="field-label">Email của bạn</label>
    <input type="email" id="emailInput" class="field-input" placeholder="ban@email.com" value="${esc(state.email)}">
    <p class="field-hint" id="emailHint">Chúng tôi không spam, không chia sẻ thông tin của bạn.</p>
    <button class="btn-primary" data-action="submit-email">Tiếp tục →</button>
  `;
}

function renderName(s){
  return `
    <h2>${esc(s.title)}</h2>
    <p class="subtitle">${esc(s.subtitle)}</p>
    <label class="field-label">Tên của bạn</label>
    <input type="text" id="nameInput" class="field-input" placeholder="Nguyễn Văn A" value="${esc(state.name)}">
    <p class="field-hint" id="nameHint">&nbsp;</p>
    <button class="btn-primary" data-action="submit-name">Xem kết quả của tôi →</button>
  `;
}

function renderLoading(){
  return `
    <div class="loading-wrap">
      <div class="ring-wrap">
        <svg width="150" height="150">
          <circle cx="75" cy="75" r="66" stroke="#E3E9F2" stroke-width="12" fill="none"/>
          <circle id="ringProgress" cx="75" cy="75" r="66" stroke="#024dc2" stroke-width="12" fill="none"
            stroke-linecap="round" stroke-dasharray="414.7" stroke-dashoffset="414.7"/>
        </svg>
        <div class="ring-pct" id="ringPct">0%</div>
      </div>
      <div class="loading-status" id="loadingStatus">Đang phân tích câu trả lời của bạn...</div>
      <div class="testi-viewport">
        <div class="testi-track" id="testiTrack">
          ${TESTIMONIALS.map(t=>`
            <div class="testi-card">
              <p>"${esc(t.text)}"</p>
              <div class="who">
                <div class="avatar">${t.avatar}</div>
                <div>
                  <div class="who-name">${esc(t.name)}</div>
                  <div class="who-role">Đã hoàn thành bài test này</div>
                </div>
              </div>
            </div>`).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderResult(){
  const r = computeResults();
  const topMeta = CATEGORY_META[r.top.key];

  if(!state.sheetSent){
    state.sheetSent = true;
    const byKey = k => r.scores.find(x=>x.key===k).count;
    sendToSheet({
      date: new Date().toISOString(),
      name: r.name,
      email: state.email,
      utm: state.utmLink,
      priority: r.top.label,
      desires: r.desires,
      feelings: r.feelings,
      innerScore: byKey('inner'),
      systemScore: byKey('system'),
      leadScore: byKey('lead'),
      q2: answerSummary(2),
      q3: answerSummary(3),
      q5: answerSummary(5),
      q7: answerSummary(7),
      q9: answerSummary(9),
      q10: answerSummary(10),
      q12: answerSummary(12),
      q14: answerSummary(14),
      q15: answerSummary(15),
      q17: answerSummary(17),
      q19: answerSummary(19),
      rawAnswers: state.answers
    });
  }

  return `
    <div class="result-hero">
      <div class="emoji">🎉</div>
      <h1>Chúc mừng ${esc(r.name)}, đây là bức tranh của bạn!</h1>
      <p>Dựa trên câu trả lời, đây là điều bạn đang khao khát và cần cải thiện nhất.</p>
    </div>

    <div class="result-section" style="margin-top:0;">
      <h3>💛 3 điều bạn đang khao khát nhất</h3>
      <div class="desire-list">
        ${r.desires.map((d,i)=>`<div class="desire-item"><span class="num">${i+1}</span><span>${esc(d)}</span></div>`).join('')}
      </div>
    </div>

    ${r.feelings.length ? `
    <div class="result-section">
      <h3>🌤️ Mỗi ngày đi làm, bạn muốn được cảm thấy</h3>
      <div class="feel-chips">
        ${r.feelings.map(f=>`<span class="feel-chip">${esc(f)}</span>`).join('')}
      </div>
    </div>` : ''}

    <div class="result-section">
      <h3>📊 Toàn cảnh 3 khía cạnh của bạn</h3>
      ${r.scores.map(sc=>`
        <div class="score-row">
          <div class="score-top">
            <span class="score-name">${sc.priority?'⭐ ':''}${esc(sc.label)}</span>
            <span class="score-count">${sc.count} dấu hiệu</span>
          </div>
          <div class="score-bar-track"><div class="score-bar-fill ${sc.priority?'priority':''}" style="width:${sc.pct}%"></div></div>
        </div>
      `).join('')}
      <div class="priority-note">
        Bạn có thể tập trung cải thiện <b>${esc(r.top.label)}</b> trước tiên — đây là khía cạnh có nhiều dấu hiệu cần thay đổi nhất.
        Sau đó, bổ sung thêm <b>${r.rest.map(x=>x.label).join(' và ')}</b> để trở thành phiên bản Team Lead toàn diện.
      </div>
    </div>

    <div class="priority-spotlight">
      <div class="spotlight-icon">${topMeta.icon}</div>
      <div class="spotlight-tag">ƯU TIÊN CẢI THIỆN</div>
      <h2>${esc(r.top.label)}</h2>
      <p>${r.top.count} dấu hiệu · ${esc(topMeta.desc)}</p>
    </div>

    <div class="cta-wrap">
      <a class="btn-primary result-cta pulse" href="phuong-phap.html" data-action="finish">Yes, Tôi Muốn Biết Cách Cải Thiện →</a>
      <p class="cta-sub">Khám phá phương pháp độc quyền đúc kết từ 10 năm kinh nghiệm làm Team Lead của Sora.</p>
    </div>
  `;
}

function computeResults(){
  const countOf = id => (state.answers[id]||[]).length;
  const goalTextOf = id => SCREENS.find(s=>s.id===id).options.find(o=>o.goal).t;

  const desireQIds = [2,3,5,7,9,10];
  const ranked = desireQIds.map(id=>({id, count:countOf(id)})).sort((a,b)=>b.count-a.count);
  const top3 = ranked.slice(0,3).map(x=>goalTextOf(x.id));

  const feelSel = state.answers[17] || [];
  const feelTexts = feelSel.map(i=> SCREENS.find(s=>s.id===17).options[i].t);

  const innerScore = countOf(5) + countOf(7);
  const systemScore = countOf(2) + countOf(3);
  const leadScore = countOf(9) + countOf(10);
  const maxScore = Math.max(innerScore, systemScore, leadScore, 1);

  const scores = [
    {key:'inner', label:'Vững nội tâm', count:innerScore, pct: Math.round((innerScore/maxScore)*100)},
    {key:'system', label:'Xây hệ thống', count:systemScore, pct: Math.round((systemScore/maxScore)*100)},
    {key:'lead', label:'Kỹ năng dẫn dắt', count:leadScore, pct: Math.round((leadScore/maxScore)*100)}
  ].sort((a,b)=>b.count-a.count);
  scores[0].priority = true;

  return {
    name: state.name || 'bạn',
    desires: top3,
    feelings: feelTexts,
    scores,
    top: scores[0],
    rest: scores.slice(1)
  };
}

function attachEvents(s){
  stage.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = parseInt(el.dataset.idx,10);
      if(s.type==='single' || s.type==='welcome'){
        if(s.type==='single') state.answers[s.id] = idx;
        stage.querySelectorAll('.opt').forEach(o=>{
          o.classList.remove('selected');
          const c = o.querySelector('.check');
          if(c) c.textContent = '';
        });
        el.classList.add('selected');
        const chk = el.querySelector('.check');
        if(chk) chk.textContent = '✓';
        setTimeout(goNext, 260);
      } else {
        const arr = state.answers[s.id] ? state.answers[s.id].slice() : [];
        const pos = arr.indexOf(idx);
        const nowSelected = pos === -1;
        if(pos>-1) arr.splice(pos,1); else arr.push(idx);
        state.answers[s.id] = arr;
        el.classList.toggle('selected', nowSelected);
        const chk = el.querySelector('.check');
        if(chk) chk.textContent = nowSelected ? '✓' : '';
        const continueBtn = stage.querySelector('[data-action="continue-multi"]');
        if(continueBtn) continueBtn.disabled = arr.length===0;
      }
    });
  });

  stage.querySelectorAll('[data-action="continue"]').forEach(btn=>{
    btn.addEventListener('click', goNext);
  });

  const continueMulti = stage.querySelector('[data-action="continue-multi"]');
  if(continueMulti){ continueMulti.addEventListener('click', ()=>{ if(!continueMulti.disabled) goNext(); }); }

  const submitEmail = stage.querySelector('[data-action="submit-email"]');
  if(submitEmail){
    submitEmail.addEventListener('click', ()=>{
      const input = document.getElementById('emailInput');
      const hint = document.getElementById('emailHint');
      const val = input.value.trim();
      const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
      if(!valid){
        hint.textContent = 'Vui lòng nhập email hợp lệ.';
        hint.classList.add('error');
        input.focus();
        return;
      }
      state.email = val;
      fbEvent('Lead');
      gaEvent('generate_lead');
      goNext();
    });
  }

  const submitName = stage.querySelector('[data-action="submit-name"]');
  if(submitName){
    submitName.addEventListener('click', ()=>{
      const input = document.getElementById('nameInput');
      const hint = document.getElementById('nameHint');
      const val = input.value.trim();
      if(!val){
        hint.textContent = 'Vui lòng nhập tên của bạn.';
        hint.classList.add('error');
        input.focus();
        return;
      }
      state.name = val;
      goNext();
    });
  }
}

function startLoading(){
  const ring = document.getElementById('ringProgress');
  const pctEl = document.getElementById('ringPct');
  const statusEl = document.getElementById('loadingStatus');
  const track = document.getElementById('testiTrack');
  const circumference = 414.7;
  const messages = [
    'Đang phân tích câu trả lời của bạn...',
    'Đang xác định điều bạn khao khát nhất...',
    'Đang tính điểm 3 khía cạnh Team Lead...',
    'Sắp xong rồi...'
  ];
  let pct = 0;
  let lastIdx = -1;
  const updateSlide = ()=>{
    const idx = pct>=66 ? 2 : (pct>=33 ? 1 : 0);
    if(idx!==lastIdx && track){ track.style.transform = `translateX(-${idx*100}%)`; lastIdx = idx; }
  };
  updateSlide();
  const interval = setInterval(()=>{
    pct += 2;
    if(pct > 100) pct = 100;
    ring.style.strokeDashoffset = circumference - (circumference*pct/100);
    pctEl.textContent = pct + '%';
    const msgIdx = Math.min(messages.length-1, Math.floor(pct/26));
    statusEl.textContent = messages[msgIdx];
    updateSlide();
    if(pct >= 100){
      clearInterval(interval);
      setTimeout(goNext, 700);
    }
  }, 180);
}

function launchConfetti(){
  const emojis = ['🎉','✨','💛','🎊'];
  for(let i=0;i<18;i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = Math.random()*100 + 'vw';
    el.style.animationDuration = (2.2 + Math.random()*1.6) + 's';
    el.style.animationDelay = (Math.random()*0.6) + 's';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4200);
  }
}

render();
</script>
